<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Tracker · Hormona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><span class="logo">H</span> Hormona</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="tracker.html">Track</a>
        <a href="insights.html">Insights</a>
        <a href="calendar.html">Calendar</a>
        <a href="history.html">History</a>
        <button class="btn btn-ghost btn-sm" id="themeToggle">🌗</button>
      </nav>
      <button class="nav-toggle">☰</button>
    </div>
  </header>

  <main class="container section">
    <div class="greeting reveal">
      <div>
        <span class="eyebrow">Daily check-in</span>
        <h2 style="margin-top:.5rem;">How are you today?</h2>
        <p class="muted">Logging takes ~60 seconds. All saved locally on your device.</p>
      </div>
    </div>

    <form id="trackerForm" class="glass reveal" style="padding:2rem;">

      <!-- SECTION 1 — CYCLE -->
      <div class="form-section">
        <h3>Cycle Data</h3>
        <div class="fields-grid">
          <div class="field">
            <label>Did your period start today?</label>
            <div class="toggle" data-field="period">
              <button type="button" data-val="false" class="on">No</button>
              <button type="button" data-val="true">Yes</button>
            </div>
          </div>
          <div class="field">
            <label>Flow intensity</label>
            <div class="chips" data-field="flow">
              <button type="button" class="chip active" data-val="none">None</button>
              <button type="button" class="chip" data-val="light">Light</button>
              <button type="button" class="chip" data-val="medium">Medium</button>
              <button type="button" class="chip" data-val="heavy">Heavy</button>
            </div>
          </div>
          <div class="field">
            <label>Cycle regularity</label>
            <div class="toggle" data-field="cycleRegular">
              <button type="button" data-val="true" class="on">Regular</button>
              <button type="button" data-val="false">Irregular</button>
            </div>
          </div>
          <div class="field">
            <label>PMS symptoms</label>
            <div class="chips" data-field="pms">
              <button type="button" class="chip active" data-val="none">None</button>
              <button type="button" class="chip" data-val="mild">Mild</button>
              <button type="button" class="chip" data-val="moderate">Moderate</button>
              <button type="button" class="chip" data-val="severe">Severe</button>
            </div>
          </div>
          <div class="field" style="grid-column: span 2;">
            <label>Cramping level <span style="color:var(--purple-700);font-weight:700;" id="crampsVal">0</span>/10</label>
            <input type="range" min="0" max="10" value="0" data-field="cramps" data-display="crampsVal" />
          </div>
        </div>
      </div>

      <!-- SECTION 2 — BODY -->
      <div class="form-section">
        <h3>Body Signals</h3>
        <div class="fields-grid">
          <div class="field"><label>Acne <span style="color:var(--purple-700);font-weight:700;" id="acneVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="acne" data-display="acneVal" /></div>
          <div class="field"><label>Hair fall <span style="color:var(--purple-700);font-weight:700;" id="hairfallVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="hairfall" data-display="hairfallVal" /></div>
          <div class="field"><label>Bloating <span style="color:var(--purple-700);font-weight:700;" id="bloatingVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="bloating" data-display="bloatingVal" /></div>
          <div class="field"><label>Cravings <span style="color:var(--purple-700);font-weight:700;" id="cravingsVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="cravings" data-display="cravingsVal" /></div>
          <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" data-field="weight" placeholder="60.0" /></div>
          <div class="field">
            <label>Skin condition</label>
            <div class="chips" data-field="skin">
              <button type="button" class="chip active" data-val="clear">Clear</button>
              <button type="button" class="chip" data-val="oily">Oily</button>
              <button type="button" class="chip" data-val="dry">Dry</button>
              <button type="button" class="chip" data-val="mixed">Mixed</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SECTION 3 — MENTAL -->
      <div class="form-section">
        <h3>Mental Health</h3>
        <div class="fields-grid">
          <div class="field"><label>Mood <span style="color:var(--purple-700);font-weight:700;" id="moodVal">5</span>/10</label><input type="range" min="0" max="10" value="5" data-field="mood" data-display="moodVal" /></div>
          <div class="field"><label>Anxiety <span style="color:var(--purple-700);font-weight:700;" id="anxietyVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="anxiety" data-display="anxietyVal" /></div>
          <div class="field"><label>Stress <span style="color:var(--purple-700);font-weight:700;" id="stressVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="stress" data-display="stressVal" /></div>
          <div class="field"><label>Motivation <span style="color:var(--purple-700);font-weight:700;" id="motivationVal">5</span>/10</label><input type="range" min="0" max="10" value="5" data-field="motivation" data-display="motivationVal" /></div>
          <div class="field" style="grid-column: span 2;"><label>Emotional sensitivity <span style="color:var(--purple-700);font-weight:700;" id="sensitivityVal">0</span>/10</label><input type="range" min="0" max="10" value="0" data-field="sensitivity" data-display="sensitivityVal" /></div>
        </div>
      </div>

      <!-- SECTION 4 — LIFESTYLE -->
      <div class="form-section">
        <h3>Lifestyle</h3>
        <div class="fields-grid">
          <div class="field"><label>Sleep (hours)</label><input type="number" step="0.5" data-field="sleep" placeholder="7.5" /></div>
          <div class="field"><label>Water (litres)</label><input type="number" step="0.1" data-field="water" placeholder="2.0" /></div>
          <div class="field"><label>Exercise (minutes)</label><input type="number" data-field="exercise" placeholder="30" /></div>
          <div class="field"><label>Screen time (hours)</label><input type="number" step="0.5" data-field="screen" placeholder="6" /></div>
          <div class="field" style="grid-column: span 2;"><label>Energy level <span style="color:var(--purple-700);font-weight:700;" id="energyVal">5</span>/10</label><input type="range" min="0" max="10" value="5" data-field="energy" data-display="energyVal" /></div>
        </div>
      </div>

      <div class="row between" style="margin-top:1.5rem;">
        <p class="muted" style="margin:0;">Saving overwrites today's entry.</p>
        <div class="row">
          <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save &amp; analyze →</button>
        </div>
      </div>
    </form>
  </main>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Init form interactions
    const form = document.getElementById("trackerForm");

    // Range live values
    form.querySelectorAll('input[type=range]').forEach(r => {
      const disp = document.getElementById(r.dataset.display);
      r.addEventListener("input", () => disp.textContent = r.value);
    });

    // Chip groups
    form.querySelectorAll('.chips').forEach(group => {
      group.querySelectorAll('.chip').forEach(c => {
        c.addEventListener("click", () => {
          group.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
        });
      });
    });
    // Toggle groups
    form.querySelectorAll('.toggle').forEach(group => {
      group.querySelectorAll('button').forEach(b => {
        b.addEventListener("click", () => {
          group.querySelectorAll('button').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
        });
      });
    });

    // Pre-fill from today's existing entry
    const existing = loadEntries().find(e => e.date === today());
    if (existing) {
      form.querySelectorAll('[data-field]').forEach(el => {
        const k = el.dataset.field;
        if (el.tagName === "INPUT" && existing[k] != null) {
          el.value = existing[k];
          if (el.dataset.display) document.getElementById(el.dataset.display).textContent = el.value;
        }
        if (el.classList.contains("chips") || el.classList.contains("toggle")) {
          const v = String(existing[k]);
          el.querySelectorAll('button').forEach(b => {
            if (b.dataset.val === v) {
              el.querySelectorAll('button').forEach(x => x.classList.remove('active','on'));
              b.classList.add(el.classList.contains("toggle") ? 'on' : 'active');
            }
          });
        }
      });
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const entry = { date: today() };
      // Inputs
      form.querySelectorAll('input[data-field]').forEach(i => {
        const k = i.dataset.field;
        const v = i.type === "range" || i.type === "number" ? Number(i.value) : i.value;
        entry[k] = v;
      });
      // Chips
      form.querySelectorAll('.chips[data-field]').forEach(g => {
        const active = g.querySelector('.chip.active');
        entry[g.dataset.field] = active ? active.dataset.val : null;
      });
      // Toggles
      form.querySelectorAll('.toggle[data-field]').forEach(g => {
        const on = g.querySelector('button.on');
        const v = on ? on.dataset.val : null;
        entry[g.dataset.field] = v === "true" ? true : v === "false" ? false : v;
      });
      addEntry(entry);
      toast("Entry saved · analyzing…");
      setTimeout(() => location.href = "results.html", 700);
    });
  </script>
</body>
</html>
